spring:
  application:
    name: bookworm-backend

  datasource:
    url: jdbc:mysql://localhost:3306/bookworm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ugly kitty}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'validate' because the schema is authoritative and already applied via Bookworm_DB_Schema_Final_v1.sql.
      # Never use 'update'/'create' here - it would let Hibernate silently drift from the approved schema.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  web:
    error:
      include-message: always

server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# HS256 signing key - MUST be overridden via JWT_SECRET env var in any real deployment;
# the default here is only good enough for local dev against a throwaway DB.
bookworm:
  jwt:
    secret: ${JWT_SECRET:bookworm-dev-only-secret-key-change-me-please-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # How often the rent/borrow/subscription expiry sweep runs (ms). 15 min default;
  # tighten for demoing the feature locally, e.g. EXPIRY_CLEANUP_FIXED_DELAY_MS=30000.
  expiry-cleanup:
    fixed-delay-ms: ${EXPIRY_CLEANUP_FIXED_DELAY_MS:900000}
